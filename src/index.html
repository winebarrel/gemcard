<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gemcard</title>
<style>
  :root { color-scheme: light dark; --border: #cfd9de; --muted: #536471; --bg: #f7f9fa; }
  @media (prefers-color-scheme: dark) { :root { --border: #2f3336; --muted: #8b98a5; --bg: #16181c; } }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; }
  h1 { font-size: 1.4rem; margin-bottom: 0.4rem; }
  p.lead { color: var(--muted); margin-top: 0; }
  input[type=text] { width: 100%; padding: 0.6rem 0.7rem; font-size: 1rem; border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box; }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 0.4rem; }
  .result { margin-top: 1.2rem; padding: 0.9rem 1rem; background: rgba(127,127,127,0.1); border-radius: 6px; display: none; }
  .result.show { display: block; }
  .result.error { color: #c00; }
  .url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.95rem; word-break: break-all; }
  button { margin-top: 0.6rem; padding: 0.4rem 0.9rem; font-size: 0.9rem; cursor: pointer; border-radius: 4px; border: 1px solid #888; background: transparent; color: inherit; }

  .preview-label { margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted); }
  .card { margin-top: 0.4rem; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; max-width: 100%; display: none; }
  .card.show { display: block; }
  .card a { display: block; color: inherit; text-decoration: none; }
  .card .img-wrap { background: var(--bg); aspect-ratio: 1200 / 630; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .card .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .img-wrap.empty { color: var(--muted); font-size: 0.85rem; }
  .card .body { padding: 0.7rem 0.9rem; border-top: 1px solid var(--border); }
  .card .domain { color: var(--muted); font-size: 0.8rem; }
  .card .title { font-size: 0.95rem; font-weight: 600; margin: 0.15rem 0 0.2rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card .desc { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skeleton { display: none; }
  .skeleton.show { display: block; }
  .skeleton .img-wrap { background: linear-gradient(90deg, var(--bg) 25%, rgba(127,127,127,0.15) 50%, var(--bg) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  .skeleton .bar { height: 0.7rem; background: linear-gradient(90deg, var(--bg) 25%, rgba(127,127,127,0.15) 50%, var(--bg) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: 4px; margin: 0.3rem 0; }
  .skeleton .bar.w70 { width: 70%; }
  .skeleton .bar.w90 { width: 90%; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  .preparing { margin-top: 1.2rem; padding: 0.9rem 1rem; background: rgba(127,127,127,0.1); border-radius: 6px; color: var(--muted); font-size: 0.9rem; display: none; }
  .preparing.show { display: block; }
  .preparing .label { margin-bottom: 0.5rem; }
  .progress { height: 0.4rem; background: rgba(127,127,127,0.15); border-radius: 999px; overflow: hidden; position: relative; }
  .progress::after { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 40%; background: rgba(127,127,127,0.55); border-radius: 999px; animation: progress-slide 1.2s ease-in-out infinite; }
  @keyframes progress-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
</style>
</head>
<body>
<h1>gemcard</h1>
<p class="lead">RubyGems の gem URL を X / Slack の OGP カード対応の URL に変換します。</p>
<input id="input" type="text" placeholder="https://rubygems.org/gems/&lt;name&gt; または gem 名">
<div class="hint">例: <code>rails</code>, <code>sinatra</code>, <code>https://rubygems.org/gems/sidekiq</code></div>

<div id="preparing" class="preparing">
  <div class="label">URL を準備中...</div>
  <div class="progress"></div>
</div>

<div id="result" class="result">
  <div class="url"><a id="link" href="" target="_blank" rel="noopener" aria-label="変換後 URL"></a></div>
  <button id="copy" type="button">コピー</button>
</div>

<div id="preview-label" class="preview-label" style="display:none">X / Slack でのカード表示プレビュー</div>

<div id="skeleton" class="card skeleton">
  <div class="img-wrap"></div>
  <div class="body">
    <div class="bar w70"></div>
    <div class="bar w90"></div>
    <div class="bar w70"></div>
  </div>
</div>

<div id="card" class="card">
  <a id="card-link" href="" target="_blank" rel="noopener">
    <div id="card-img-wrap" class="img-wrap"><img id="card-img" alt=""></div>
    <div class="body">
      <div class="domain">rubygems.org</div>
      <div id="card-title" class="title"></div>
      <div id="card-desc" class="desc"></div>
    </div>
  </a>
</div>

<script>
const input = document.getElementById('input');
const preparing = document.getElementById('preparing');
const result = document.getElementById('result');
const link = document.getElementById('link');
const copy = document.getElementById('copy');
const previewLabel = document.getElementById('preview-label');
const skeleton = document.getElementById('skeleton');
const card = document.getElementById('card');
const cardLink = document.getElementById('card-link');
const cardImgWrap = document.getElementById('card-img-wrap');
const cardImg = document.getElementById('card-img');
const cardTitle = document.getElementById('card-title');
const cardDesc = document.getElementById('card-desc');

function extractGemName(s) {
  s = (s || '').trim();
  if (!s) return null;
  const m = s.match(/rubygems\.org\/gems\/([a-zA-Z0-9_.-]+)/i);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_.-]+$/.test(s)) return s;
  return null;
}

function formatDownloads(n) {
  if (n >= 1e9) return `${(n/1e9).toFixed(1)}B`;
  if (n >= 1e6) return `${(n/1e6).toFixed(1)}M`;
  if (n >= 1e3) return `${(n/1e3).toFixed(1)}K`;
  return String(n);
}

let currentName = null;
let fetchToken = 0;
let debounceTimer = null;

function hidePreview() {
  previewLabel.style.display = 'none';
  card.classList.remove('show');
  skeleton.classList.remove('show');
}

function showSkeleton() {
  previewLabel.style.display = 'block';
  card.classList.remove('show');
  skeleton.classList.add('show');
}

function showCard(data) {
  cardLink.href = data.rubygemsUrl;
  const title = data.name + (data.version ? ` ${data.version}` : '');
  cardTitle.textContent = title;
  const metaParts = [];
  if (data.authors) metaParts.push(`by ${data.authors}`);
  if (data.downloads) metaParts.push(`${formatDownloads(data.downloads)} downloads`);
  cardDesc.textContent = data.info ? data.info : metaParts.join(' • ');
  cardImg.src = `${location.origin}/img/${encodeURIComponent(data.name)}.png`;
  cardImgWrap.classList.remove('empty');
  cardImg.style.display = '';
  previewLabel.style.display = 'block';
  skeleton.classList.remove('show');
  card.classList.add('show');
}

function showLink(name) {
  const out = `${location.origin}/gems/${encodeURIComponent(name)}`;
  link.textContent = out;
  link.href = out;
  result.classList.add('show');
  result.classList.remove('error');
  preparing.classList.remove('show');
}

function showError(msg) {
  link.textContent = msg;
  link.removeAttribute('href');
  result.classList.add('show', 'error');
  preparing.classList.remove('show');
}

function hideResult() {
  result.classList.remove('show', 'error');
  preparing.classList.remove('show');
}

async function loadPreview(name) {
  const token = ++fetchToken;
  showSkeleton();
  try {
    const res = await fetch(`/api/preview/${encodeURIComponent(name)}`);
    if (token !== fetchToken) return;
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    if (token !== fetchToken) return;
    if (data.notFound) {
      hidePreview();
      showError('gem が見つかりません');
      return;
    }
    showCard(data);
    showLink(data.name);
  } catch {
    if (token !== fetchToken) return;
    hidePreview();
    showError('プレビュー取得に失敗しました');
  }
}

function update() {
  const name = extractGemName(input.value);
  if (!name) {
    currentName = null;
    hidePreview();
    if (input.value.trim()) {
      showError('gem 名を検出できませんでした');
    } else {
      hideResult();
    }
    if (debounceTimer) clearTimeout(debounceTimer);
    return;
  }

  if (name !== currentName) {
    currentName = name;
    hideResult();
    preparing.classList.add('show');
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => loadPreview(name), 350);
  }
}

input.addEventListener('input', update);

copy.addEventListener('click', async () => {
  if (!link.href) return;
  try {
    await navigator.clipboard.writeText(link.href);
    const orig = copy.textContent;
    copy.textContent = 'コピーしました';
    setTimeout(() => copy.textContent = orig, 1500);
  } catch {
    // ignore
  }
});
</script>
</body>
</html>
